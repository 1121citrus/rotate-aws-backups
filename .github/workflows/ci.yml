name: CI

on:
  push:
    branches: [main, master, staging]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  ci:
    uses: 1121citrus/shared-github-workflows/.github/workflows/pipeline.yml@v1
    with:
      image: 1121citrus/rotate-aws-backups
      inject-metadata: true
      test-mode: bats
      test-bats-files: |
        test/01-dockerfile.bats
        test/02-functional.bats
        test/03-build.bats
        test/04-image-metadata.bats
        test/05-common-functions.bats
        test/06-rotate-aws-backups.bats
      smoke-enabled: true
      smoke-commands: |
        docker run --rm "${IMAGE}:${VERSION}" bash -c 'test -x /usr/local/bin/rotate-aws-backups'
        docker run --rm "${IMAGE}:${VERSION}" /usr/local/bin/rotate-aws-backups --help
    secrets: inherit
